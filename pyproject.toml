[project]
name = "agent-mosaic"
version = "0.1.0"
description = "Collect and automatically score Agent Mosaic benchmark responses"
readme = "README.md"
authors = [
    { name = "Daniel Ruiz", email = "dcruiz@usc.edu" }
]
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "datasets>=4.8.4,<5",
    "httpx>=0.28.1,<0.29",
    "openai>=2.29.0,<3",
    "pydantic>=2.12.0,<3",
]

[project.scripts]
agent-mosaic = "agent_mosaic:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
